           <body onload="getName()">

                <!-- creating a modal to display character inventory -->
                <div class="modal-container" id="inventory-modal">
        
                    <div class="modal-content-container">
        
                        <h1 style="margin-top:1rem;"><span>Inventory</span></h1>
        
                        <div class="modal-content">
                            <p style="text-align:left;"><span id="inventory-items"></span></p>
                        </div>
        
                        <div class="modal-button-container">
                            <button onclick="closeInventory()">Close</button>
                        </div>
        
                    </div>
                </div>
        <!-- end inventory modal-->

        <!-- create a modal to display the map -->
        <div class="modal-container" id="map-modal">
          <div class="modal-content-container">
            <div class="modal-content">
              <div class="map-container" id="map-container">
                <img alt="" id="map" src="assets/map.jpg" />
              </div>
            </div>
            <div class="modal-button-container dark-outlines">
              <button onclick="closeMap()">Close</button>
            </div>
          </div>
        </div>
        <!-- end map modal -->

                <div class="game-container">
                    <div class="heading" id="top-line"></div>
                    <div class="details-container" id="details-container">

                            <span class="modifier-name" id="modifier-name">
                                <div>Click to roll</div>
                            </span>
                            <div class="roll-click" id="roll-click" onclick="rollModified()"></div>
                            <div class="roll-box" id="roll-box"><span class="roll-box-span" id="roll-box-span">0</span></div>
                            <div class="exploded-roll" id="exploded-roll"></div>

                        <div class="modifier-table" id="modifier-table"></div>
                        <div class="bonus-container" id="bonus-container"></div>
